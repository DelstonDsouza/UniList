<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Passenger Dashboard • RideMate Prototype</title>
    <!-- Leaflet styles -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Inter font for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- App styles -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 
      Passenger Home Screen
      Mobile-first layout: Map (top ~48%), Booking Panel (bottom ~52%)
    -->
    <div class="app">
      <!-- MAP SECTION -->
      <div id="map"></div>

      <!-- Distance/ETA bubble -->
      <div id="route-info" class="route-info hidden">
        <span id="route-distance">0 km</span>
        <span class="dot">•</span>
        <span id="route-eta">0 min</span>
      </div>

      <!-- BOTTOM BOOKING PANEL -->
      <div class="booking-panel">
        <!-- PICKUP INPUT -->
        <div class="row">
          <div class="row-icon pickup" aria-hidden="true"></div>
          <input
            id="pickup-input"
            type="text"
            placeholder="Pickup location"
            autocomplete="off"
            aria-label="Pickup location"
          />
          <button id="use-current-btn" class="icon-btn" title="Use current location">📍</button>
          <button id="schedule-btn" class="pill-btn" title="Schedule pickup">
            <span aria-hidden="true">🕒</span>
            <span class="pill-text">Later</span>
          </button>
        </div>
        <div id="pickup-suggestions" class="suggestions" aria-label="Pickup suggestions"></div>

        <!-- DESTINATION INPUT -->
        <div class="row">
          <div class="row-icon destination" aria-hidden="true"></div>
          <input
            id="dest-input"
            type="text"
            placeholder="Destination"
            autocomplete="off"
            aria-label="Destination"
          />
        </div>
        <div id="dest-suggestions" class="suggestions" aria-label="Destination suggestions"></div>

        <div class="divider"></div>

        <!-- Scheduling handled via 'Later' bottom sheet -->

        <!-- RECURRING RIDE SWITCH -->
        <div class="row toggle-row">
          <div class="toggle-label">
            <span class="toggle-title">Save Ride</span>
          </div>
          <label class="switch">
            <input id="recurring-switch" type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>

        <!-- PRIMARY CTA -->
        <button id="find-pool-btn" class="primary-btn" type="button">Find Pool</button>
        
        <!-- Schedule bottom sheet -->
        <div id="schedule-backdrop" class="sheet-backdrop hidden" aria-hidden="true"></div>
        <div id="schedule-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Choose a time">
          <div class="sheet-grabber" aria-hidden="true"></div>
          <div class="sheet-title">Choose a time</div>
          <div class="sheet-controls">
            <label class="sheet-field">
              <span>Date</span>
              <select id="sheet-date"></select>
            </label>
            <div class="sheet-time">
              <label class="sheet-field">
                <span>Hour</span>
                <select id="sheet-hour"></select>
              </label>
              <label class="sheet-field">
                <span>Min</span>
                <select id="sheet-minute"></select>
              </label>
              <label class="sheet-field">
                <span>AM/PM</span>
                <select id="sheet-ampm">
                  <option>AM</option>
                  <option>PM</option>
                </select>
              </label>
            </div>
          </div>
          <div id="sheet-preview" class="sheet-preview"></div>
          <div class="sheet-actions">
            <button id="sheet-cancel" class="ghost-btn">Cancel</button>
            <button id="sheet-done" class="primary-btn">Done</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Leaflet script -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- App script -->
    <script src="./script.js"></script>
  </body>
  </html>
